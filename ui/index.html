<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý đơn hàng & đổi trả</title>
  <style>
    :root { --navy:#122552; --blue:#2463eb; --green:#0e9f6e; --green-bg:#ebfaf3; --blue-bg:#eef5ff; --slate:#64748b; --line:#dbe4f0; --bg:#f6f8fc; --text:#172554; --amber:#b45309; --amber-bg:#fff7e6; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,Segoe UI,Arial,sans-serif; }
    .shell { max-width:1180px; margin:28px auto; padding:0 20px; } .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.4px; } .subtitle { color:var(--slate); margin:4px 0 0; } .status { display:flex; gap:8px; align-items:center; color:#087c56; font-weight:600; background:var(--green-bg); padding:8px 12px; border-radius:999px; }
    .dot { width:9px; height:9px; background:#16a34a; border-radius:50%; }.app { display:grid; grid-template-columns:330px 1fr; background:white; border:1px solid var(--line); border-radius:20px; min-height:690px; overflow:hidden; box-shadow:0 16px 50px #17255412; }
    .panel { padding:24px; border-right:1px solid var(--line); background:#fbfcff; } .brand { display:flex; gap:11px; align-items:center; font-weight:750; font-size:18px; }.icon { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:var(--blue); color:white; font-size:21px; }
    .label { color:var(--slate); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:700; margin:32px 0 10px; }.mode { width:100%; text-align:left; border:1px solid var(--line); background:white; color:var(--text); padding:13px; border-radius:12px; margin:7px 0; cursor:pointer; font:inherit; }.mode strong { display:block; }.mode span { display:block; font-size:12px; color:var(--slate); margin-top:2px; }.mode.active { border-color:var(--blue); background:var(--blue-bg); box-shadow:inset 3px 0 var(--blue); }
    select { width:100%; border:1px solid var(--line); padding:11px; border-radius:10px; background:white; color:var(--text); font:inherit; }.legend { margin-top:30px; padding:14px; border-radius:12px; background:white; border:1px solid var(--line); font-size:13px; }.legend p { margin:8px 0; display:flex; gap:8px; align-items:center; }.chip { width:9px; height:9px; border-radius:50%; background:var(--green); }.chip.blue { background:var(--blue); }.chip.amber { background:#f59e0b; }
    .chat { display:flex; flex-direction:column; min-width:0; }.chat-head { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }.chat-head b { font-size:17px; }.badge { font-size:12px; padding:5px 10px; border-radius:99px; background:var(--green-bg); color:#087c56; font-weight:700; }.content { flex:1; padding:26px 28px; overflow:auto; }.message { max-width:720px; margin-bottom:18px; }.from-user { margin-left:auto; background:var(--blue); color:white; padding:13px 15px; border-radius:16px 16px 4px 16px; }.assistant-title { color:var(--slate); font-weight:700; font-size:12px; margin-bottom:7px; }.answer { padding:15px; background:#f8fafc; border:1px solid var(--line); border-radius:4px 16px 16px 16px; }.trace { margin-top:16px; border:1px solid #b7ebd1; border-radius:14px; overflow:hidden; background:#fbfffd; }.trace header { padding:11px 14px; background:var(--green-bg); color:#087c56; font-weight:750; display:flex; justify-content:space-between; }.step { padding:12px 14px; display:grid; grid-template-columns:22px 92px 1fr; gap:8px; border-top:1px solid #d9f3e5; font-size:13px; }.tick { color:#079669; font-weight:800; }.kind { font-weight:700; color:#196d50; }.result { color:#35506f; }.notice { margin-top:16px; padding:12px 14px; background:var(--amber-bg); color:#8a4b07; border-radius:10px; font-size:13px; display:none; }.composer { padding:16px 28px; border-top:1px solid var(--line); display:flex; gap:10px; }.composer input { flex:1; border:1px solid var(--line); padding:13px 14px; border-radius:11px; font:inherit; }.composer button { background:var(--blue); color:white; border:0; padding:0 19px; border-radius:11px; font-weight:700; cursor:pointer; }
    @media (max-width:760px) { .app { grid-template-columns:1fr; }.panel { border-right:0; border-bottom:1px solid var(--line); }.label { margin-top:18px; }.top { align-items:flex-start; flex-direction:column; }.status { align-self:flex-start; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><h1>Trợ lý đơn hàng & đổi trả</h1><p class="subtitle">Demo giao diện Chatbot Baseline và ReAct Agent</p></div><div class="status"><span class="dot"></span> Hệ thống sẵn sàng</div></div>
    <section class="app">
      <aside class="panel">
        <div class="brand"><span class="icon">◎</span>OrderCare AI</div>
        <p class="label">Chế độ xử lý</p>
        <button class="mode" data-mode="baseline"><strong>Chatbot Baseline</strong><span>1 LLM call · Không dùng tool</span></button>
        <button class="mode active" data-mode="react"><strong>ReAct Agent</strong><span>Thought → Action → Observation</span></button>
        <p class="label">Test case demo</p>
        <select id="scenario"><option value="exchange">#8 · Đổi size DH1004</option><option value="expired">#12 · Trả hàng quá hạn DH8888</option><option value="missing">#11 · Mã đơn không tồn tại</option></select>
        <div class="legend"><strong>Trạng thái</strong><p><span class="chip blue"></span> Baseline</p><p><span class="chip"></span> Tool thực thi thành công</p><p><span class="chip amber"></span> Guardrail / fallback</p></div>
      </aside>
      <section class="chat">
        <div class="chat-head"><b id="modeName">ReAct Agent</b><span class="badge" id="modeBadge">3 tool steps</span></div>
        <div class="content">
          <div class="message from-user" id="question"></div>
          <div class="message"><div class="assistant-title">ORDERCARE AI</div><div class="answer" id="answer"></div><div class="trace" id="trace"></div><div class="notice" id="notice"></div></div>
        </div>
        <div class="composer"><input aria-label="Câu hỏi" placeholder="Nhập mã đơn hoặc câu hỏi của bạn…"><button type="button">Gửi</button></div>
      </section>
    </section>
  </main>
  <script>
    const data = {
      exchange: { q:'Tôi muốn đổi áo trong đơn #DH1004 từ size M sang L.', a:'Phiếu đổi trả RET-DH1004-2026 đã được tạo thành công. Shipper sẽ đến lấy hàng trong 24 giờ tới.', steps:[['Thought','Cần tra cứu thông tin đơn hàng.'],['Action','lookup_order(DH1004)'],['Observation','Đã giao · Thời trang · 2 ngày trước'],['Action','check_return_policy(Thời trang, 2)'],['Observation','HỢP LỆ: đổi trả trong 7 ngày'],['Action','create_return_request(DH1004)']], notice:'' },
      expired: { q:'Tôi muốn trả lại sản phẩm trong đơn #DH8888 đã mua từ 8 tháng trước.', a:'TỪ CHỐI: Đơn đã giao 240 ngày; ngành Điện tử chỉ hỗ trợ đổi trả trong 7 ngày đầu.', steps:[['Thought','Cần tra cứu thông tin đơn hàng.'],['Action','lookup_order(DH8888)'],['Observation','Đã giao · Điện tử · 240 ngày trước'],['Action','check_return_policy(Điện tử, 240)'],['Observation','TỪ CHỐI: vượt quá thời hạn']], notice:'Guardrail hoạt động: Agent dừng trước khi tạo phiếu đổi trả.' },
      missing: { q:'Tra cứu giúp tôi vị trí đơn hàng #DH9999999.', a:'Tôi chưa tìm thấy đơn hàng này. Vui lòng kiểm tra lại mã đơn hoặc liên hệ CSKH.', steps:[['Thought','Cần tra cứu thông tin đơn hàng.'],['Action','lookup_order(DH9999999)'],['Observation','LỖI: Không tìm thấy đơn hàng']], notice:'Guardrail hoạt động: Agent dừng ngay sau Observation lỗi.' }
    };
    let mode = 'react'; const scenario = document.querySelector('#scenario');
    function render(){ const d=data[scenario.value]; document.querySelector('#question').textContent=d.q; const baseline=mode==='baseline'; document.querySelector('#modeName').textContent=baseline?'Chatbot Baseline':'ReAct Agent'; document.querySelector('#modeBadge').textContent=baseline?'1 LLM call · 0 tool':'Trace tool'; document.querySelector('#answer').textContent=baseline?'Tôi không thể xác minh dữ liệu đơn hàng hoặc chính sách thực tế. Vui lòng liên hệ CSKH để được hỗ trợ chính xác.':d.a; const trace=document.querySelector('#trace'); trace.style.display=baseline?'none':'block'; trace.innerHTML='<header><span>Trace ReAct</span><span>✓ Quan sát được</span></header>'+d.steps.map((s,i)=>'<div class="step"><span class="tick">'+(s[0]==='Observation'?'◉':'✓')+'</span><span class="kind">'+s[0]+'</span><span class="result">'+s[1]+'</span></div>').join(''); const notice=document.querySelector('#notice'); notice.textContent=d.notice; notice.style.display=!baseline&&d.notice?'block':'none'; document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode)); }
    document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;render()}); scenario.onchange=render; render();
  </script>
  <script>
    (() => {
      const presets = {
        exchange: 'Tôi muốn đổi áo trong đơn #DH1004 từ size M sang L.',
        expired: 'Tôi muốn trả lại sản phẩm trong đơn #DH8888 đã mua từ 8 tháng trước.',
        missing: 'Tra cứu giúp tôi vị trí đơn hàng #DH9999999.'
      };
      let liveMode = 'react';
      const input = document.querySelector('.composer input');
      const sendButton = document.querySelector('.composer button');
      const question = document.querySelector('#question');
      const answer = document.querySelector('#answer');
      const trace = document.querySelector('#trace');
      const notice = document.querySelector('#notice');
      const modeName = document.querySelector('#modeName');
      const modeBadge = document.querySelector('#modeBadge');

      function renderTrace(items) {
        trace.style.display = items.length ? 'block' : 'none';
        trace.innerHTML = '<header><span>Trace ReAct</span><span>● Quan sát được</span></header>' + items.map(item =>
          `<div class="step"><span class="tick">${item.kind === 'Observation' ? '◉' : '✓'}</span><span class="kind">${item.kind}</span><span class="result">${item.text}</span></div>`
        ).join('');
      }

      async function send(message) {
        if (!message.trim()) return;
        question.textContent = message;
        answer.textContent = 'Đang xử lý yêu cầu của bạn…';
        trace.style.display = 'none';
        notice.style.display = 'none';
        try {
          const response = await fetch('/api/chat', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message, mode: liveMode})
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Không thể xử lý yêu cầu');
          answer.textContent = result.answer;
          renderTrace(result.trace || []);
          if ((result.answer || '').startsWith('TỪ CHỐI') || (result.answer || '').includes('chưa tìm thấy')) {
            notice.textContent = 'Guardrail đang bảo vệ luồng xử lý: Agent dừng an toàn, không thực hiện thao tác sai.';
            notice.style.display = 'block';
          }
        } catch (error) {
          answer.textContent = `Không thể kết nối API: ${error.message}`;
          notice.textContent = 'Hãy chạy: python src/web_server.py';
          notice.style.display = 'block';
        }
      }

      document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => {
        liveMode = button.dataset.mode;
        modeName.textContent = liveMode === 'react' ? 'ReAct Agent' : 'Chatbot Baseline';
        modeBadge.textContent = liveMode === 'react' ? 'Trace tool' : '1 LLM call · 0 tool';
        send(input.value || presets[scenario.value]);
      }));
      scenario.addEventListener('change', () => send(presets[scenario.value]));
      sendButton.addEventListener('click', () => { send(input.value); input.value = ''; });
      input.addEventListener('keydown', event => { if (event.key === 'Enter') { send(input.value); input.value = ''; } });
      send(presets.exchange);
    })();
  </script>
</body>
</html>
